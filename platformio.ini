; PlatformIO Project Configuration File
;
; Optical body — ESP32-S3 physical field node for MetaField

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D OPTICAL_BODY_NODE_ID=\"optical_s3_001\"
    ; Uncomment the next line ONLY during pure board bring-up without detectors wired
    ; -D OPTICAL_USE_SYNTHETIC=1
    ;
    ; Optional pin overrides for CD74HC4067 (defaults shown):
    ; -D MUX_S0_PIN=4
    ; -D MUX_S1_PIN=5
    ; -D MUX_S2_PIN=6
    ; -D MUX_S3_PIN=7
    ; -D MUX_EN_PIN=15          ; set to -1 if EN is hard-tied to GND
    ; -D ADS_MUX_CHANNEL=0      ; ADS1115 channel that receives mux SIG
    ; -D BPW34_FULL_SCALE_V=3.3 ; tune after front-end characterization
    ;
    ; Laser pins (default -1 = not wired, only logged).
    ; Example once the drivers are connected:
    ; -D LASER_PIN_0=10
    ; -D LASER_PIN_1=11
    ; -D LASER_PIN_2=12
    ; ... up to LASER_PIN_11
lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
    bblanchon/ArduinoJson@^7.0.0
