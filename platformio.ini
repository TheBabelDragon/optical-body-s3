; PlatformIO Project Configuration File
;
; Optical body — ESP32-S3 physical field node for MetaField

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D OPTICAL_BODY_NODE_ID=\"optical_s3_001\"
    -D FB_FIRMWARE_VER=1
    ; Field Bus TWAI pins (override to match your transceiver wiring)
    ; -D FB_TWAI_TX_PIN=1
    ; -D FB_TWAI_RX_PIN=2
    ; Uncomment ONLY for pure board bring-up without detectors
    ; -D OPTICAL_USE_SYNTHETIC=1
    ;
    ; Mux / laser pin overrides — see earlier docs
lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
    bblanchon/ArduinoJson@^7.0.0
