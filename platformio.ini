; PlatformIO Project Configuration File
;
; Optical body — ESP32-S3 physical field node for MetaField

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = direct

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D OPTICAL_BODY_NODE_ID=\"optical_s3_001\"
    -D FB_FIRMWARE_VER=1
    -D SAFE_BOOT=0
    -D WIRE_SDA_PIN=8
    -D WIRE_SCL_PIN=9
    -D MUX_S0_PIN=4
    -D MUX_S1_PIN=5
    -D MUX_S2_PIN=6
    -D MUX_S3_PIN=7
    -D MUX_EN_PIN=15
    -D FB_USE_MCP2518FD=1
    -D FB_SPI_SCK=12
    -D FB_SPI_MOSI=11
    -D FB_SPI_MISO=13
    -D FB_SPI_CS=10
    -D FB_SPI_INT=14
    -D FB_MCP_OSC=20000000
    -D OPTICAL_UI=1
    -D UI_ENC_A_PIN=1
    -D UI_ENC_B_PIN=2
    -D UI_ENC_SW_PIN=3
    -D UI_CONFIRM_PIN=16
    -D UI_RETURN_PIN=17
    -D UI_OLED_ADDR=0x3C
    -D UI_ENC_DETENT=4

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB

lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
    bblanchon/ArduinoJson@^7.0.0
    pierremolinaro/ACAN2517FD@^2.1.1
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SH110X@^2.1.10
