; PlatformIO Project Configuration File
;
; Optical body — ESP32-S3 physical field node for MetaField

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D OPTICAL_BODY_NODE_ID=\"optical_s3_001\"
    ; Uncomment ONLY for pure board bring-up without detectors
    ; -D OPTICAL_USE_SYNTHETIC=1
    ;
    ; Mux select lines (shared by all CD74HC4067 boards)
    ; -D MUX_S0_PIN=4
    ; -D MUX_S1_PIN=5
    ; -D MUX_S2_PIN=6
    ; -D MUX_S3_PIN=7
    ; -D MUX_EN_PIN=15          ; EN for mux 0 (ADS @0x48)
    ;
    ; Extra mux EN pins (defaults: 16, 17, 18)
    ; -D MUX1_EN_PIN=16         ; EN for mux 1 (ADS @0x49)
    ; -D MUX2_EN_PIN=17
    ; -D MUX3_EN_PIN=18
    ;
    ; -D BPW34_FULL_SCALE_V=3.3
    ;
    ; Laser pins (default -1 = not wired)
    ; -D LASER_PIN_0=10
    ; -D LASER_PIN_1=11
    ; ...
lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
    bblanchon/ArduinoJson@^7.0.0
