; PlatformIO Project Configuration File
;
; Optical body — ESP32-S3 physical field node for MetaField
; Phase-0 pin map is LOCKED — see WIRING_PHASE0.md

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D OPTICAL_BODY_NODE_ID=\"optical_s3_001\"
    -D FB_FIRMWARE_VER=1
    ; --- TEMPORARY DIAGNOSTIC — set to 1 to get a clean boot ---
    -D SAFE_BOOT=1
    ; --- I²C (ADS1115, MCP23017, FRAM, OLED, …) ---
    -D WIRE_SDA_PIN=8
    -D WIRE_SCL_PIN=9
    ; --- CD74HC4067 (shared S0-S3; per-mux EN) ---
    -D MUX_S0_PIN=4
    -D MUX_S1_PIN=5
    -D MUX_S2_PIN=6
    -D MUX_S3_PIN=7
    -D MUX_EN_PIN=15
    ; --- MCP2518FD CAN-FD (SPI) ---
    -D FB_USE_MCP2518FD=1
    -D FB_SPI_SCK=12
    -D FB_SPI_MOSI=11
    -D FB_SPI_MISO=13
    -D FB_SPI_CS=10
    -D FB_SPI_INT=14
    -D FB_MCP_OSC=20000000
    ; --- DKARDU EC11 + 1.3" SH1106 OLED UI (optional) ---
    -D OPTICAL_UI=1
    -D UI_ENC_A_PIN=1
    -D UI_ENC_B_PIN=2
    -D UI_ENC_SW_PIN=3
    -D UI_CONFIRM_PIN=16
    -D UI_RETURN_PIN=17
    -D UI_OLED_ADDR=0x3C
    ; -D OPTICAL_USE_SYNTHETIC=1
lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
    bblanchon/ArduinoJson@^7.0.0
    pierremolinaro/ACAN2517FD@^2.1.1
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SH110X@^2.1.10
