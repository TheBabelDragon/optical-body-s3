; PlatformIO Project Configuration File
;
; Optical body — ESP32-S3 physical field node for MetaField

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D OPTICAL_BODY_NODE_ID=\"optical_s3_001\"
    -D FB_FIRMWARE_VER=1
    ; Field Bus — MCP2518FD over SPI (CAN-FD)
    -D FB_USE_MCP2518FD=1
    -D FB_SPI_SCK=12
    -D FB_SPI_MOSI=11
    -D FB_SPI_MISO=13
    -D FB_SPI_CS=10
    -D FB_SPI_INT=14
    -D FB_MCP_OSC=20000000
    ; Uncomment ONLY for pure board bring-up without detectors
    ; -D OPTICAL_USE_SYNTHETIC=1
lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
    bblanchon/ArduinoJson@^7.0.0
    pierremolinaro/ACAN2517FD@^2.1.1
